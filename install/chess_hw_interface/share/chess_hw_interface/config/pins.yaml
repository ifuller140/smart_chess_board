# GPIO Pin Configuration for Smart Chess Board
# Uses BCM numbering by default

stepper_driver:
  ros__parameters:
    motorA_pins: [17, 18, 27, 22] # [IN1, IN2, IN3, IN4] - PLACEHOLDER
    motorB_pins: [23, 24, 25, 5]  # [IN1, IN2, IN3, IN4] - PLACEHOLDER
    step_sequence: 'half'         # 'full' or 'half'
    step_delay_default: 0.001     # seconds between steps

servo_node:
  ros__parameters:
    servo_pin: 12                 # PWM pin - PLACEHOLDER
    engage_pwm: 2.5               # Duty cycle or pulse width for engaged (down)
    release_pwm: 7.5              # Duty cycle or pulse width for released (up)
    movement_time: 0.5            # Seconds to wait for movement

limit_switch_node:
  ros__parameters:
    limit_switch_pins:
      x_min: 6                    # PLACEHOLDER
      y_min: 13                   # PLACEHOLDER
      clock_hit: 19               # PLACEHOLDER
    debounce_ms: 20

clock_display:
  ros__parameters:
    display1_pins: [0, 0, 0, 0]   # PLACEHOLDER
    display2_pins: [0, 0, 0, 0]   # PLACEHOLDER
