# GPIO Pin Configuration for Smart Chess Board
# Uses BCM numbering by default

stepper_driver:
  ros__parameters:
    # A4988 Driver Pin Configuration (NEMA 11 Motors)
    motorA_dir_pin: 27            # Direction pin for Motor A (GPIO27, Physical 13)
    motorA_step_pin: 22           # Step pin for Motor A (GPIO22, Physical 15)
    motorB_dir_pin: 6             # Direction pin for Motor B (GPIO6, Physical 31)
    motorB_step_pin: 5            # Step pin for Motor B (GPIO5, Physical 29)
    motor_enable_pin: 17          # Shared ENABLE pin (active LOW)

    # Timing Parameters (full-step mode)
    dir_setup_us: 50              # DIR setup time in microseconds (conservative for Linux userspace timing)
    step_pulse_us: 100            # STEP pulse width in microseconds
    min_step_delay_ms: 5.0        # Minimum delay between steps (max speed, torque-safe baseline)
    max_step_delay_ms: 50.0       # Maximum delay between steps (min speed)
    accel_ramp_steps: 40          # Linear acceleration/deceleration ramp steps
    hold_torque_when_idle: true   # Keep drivers enabled between moves


servo_node:
  ros__parameters:
    servo_pin: 12                 # Z-Axis Servo (Hardware PWM)
    engage_pulse_us: 500          # Down position (microseconds)
    release_pulse_us: 1500        # Up position (microseconds)
    movement_time: 0.5            # Seconds to wait for movement

clock_servo_node:
  ros__parameters:
    clock_servo_pin: 18           # Clock servo (Hardware PWM)
    rest_pulse_us: 500            # Servo at rest (microseconds)
    hit_pulse_us: 1500            # Servo pressing button (microseconds)
    hit_duration: 0.3             # Seconds to hold button

clock_display_node:
  ros__parameters:
    display1_pins: [25, 8]        # CLK=GPIO25, DIO=GPIO8
    display2_pins: [7, 26]        # CLK=GPIO7,  DIO=GPIO26 (moved from GPIO1 which is reserved)
    brightness: 7                 # Initial brightness (0-7)

limit_switch_node:
  ros__parameters:
    limit_switch_pins:
      x_min: 10      # GPIO10 - Physical Pin 19 (per pinout.md diagram)
      y_min: 9       # GPIO9 - Physical Pin 21 (per pinout.md diagram)
      clock_hit: 15  # GPIO15 - Physical Pin 10 (per pinout.md diagram)
    debounce_ms: 20


