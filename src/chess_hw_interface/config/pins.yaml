# GPIO Pin Configuration for Smart Chess Board
# Uses BCM numbering by default

stepper_driver:
  ros__parameters:
    motorA_pins: [14, 4, 3, 2]   # [IN1, IN2, IN3, IN4]
    motorB_pins: [24, 23, 22, 27] # [IN1, IN2, IN3, IN4]
    step_sequence: 'half'         # 'full' or 'half'
    step_delay_default: 0.001     # seconds between steps

servo_node:
  ros__parameters:
    servo_pin: 12                 # Z-Axis Servo (Hardware PWM)
    engage_pwm: 2.5               # Duty cycle or pulse width for engaged (down)
    release_pwm: 7.5              # Duty cycle or pulse width for released (up)
    movement_time: 0.5            # Seconds to wait for movement
    
clock_servo_node:
  ros__parameters:
    clock_servo_pin: 16           # Hits clock button
    rest_pwm: 2.5                 # Servo at rest
    hit_pwm: 7.5                  # Servo pressing button
    hit_duration: 0.3             # Seconds to hold button

limit_switch_node:
  ros__parameters:
    limit_switch_pins:
      x_min: 10      # GPIO10 - Physical Pin 19 (per pinout.md diagram)
      y_min: 9       # GPIO9 - Physical Pin 21 (per pinout.md diagram)
      clock_hit: 15  # GPIO15 - Physical Pin 10 (per pinout.md diagram)
    debounce_ms: 20

clock_display:
  ros__parameters:
    display1_pins: [25, 8]  # CLK, DIO
    display2_pins: [7, 1]   # CLK, DIO
